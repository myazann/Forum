<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Forum — Discussion</title>
    <link rel="stylesheet" href="/static/forum.css?v=2" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="shell">
      <div class="shell-inner" id="shellBar">
        <a class="brand" href="/">forum</a>
      </div>
    </header>
    <main class="wrap room-wrap" id="main">
      <div id="roomHeader"></div>
      <div id="steps"></div>
      <div id="message" role="alert"></div>
      <div id="progress" role="status" aria-live="polite"></div>
      <section id="stage">
        <div class="loading">Opening the discussion…</div>
      </section>
      <section id="support"></section>
      <footer class="footer">
        <span>One question. Many perspectives.</span
        ><span>Respond to the proposal, never to a person.</span>
      </footer>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/static/forum.js?v=2"></script>
    <script src="/static/room.js?v=2"></script>
  </body>
</html>
