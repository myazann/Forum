<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Forum — deliberation</title>
<link rel="stylesheet" href="/static/forum.css">
<style>
  .steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 18px; }
  .steps .st { font-size: 12px; font-weight: 650; color: var(--muted); border: 1px solid var(--line);
               background: var(--card); border-radius: 999px; padding: 4px 12px; }
  .steps .st.done { color: var(--accent); border-color: var(--mark); }
  .steps .st.now { color: #fff; background: var(--accent); border-color: var(--accent); }
  .steps .arr { color: var(--line); font-weight: 700; }
  .pastround > summary { cursor: pointer; font-family: Georgia, serif; font-size: 16px;
                         padding: 14px 18px; }
  .pastround { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
               margin-bottom: 14px; box-shadow: var(--shadow); }
  .pastround .card { border: 0; box-shadow: none; margin: 0; padding-top: 4px; }
  .loopbadge { display: inline-block; font-size: 11px; font-weight: 750; border-radius: 999px;
               padding: 2px 10px; color: var(--accent); background: var(--accent-soft);
               border: 1px solid var(--accent); }
  .offer { border: 2px solid var(--accent); border-radius: 12px; background: var(--card);
           padding: 20px 22px; margin-top: 6px; }
  .offer h3.otitle { font-family: Georgia, serif; font-size: 20px; margin: 6px 0 10px;
                     text-transform: none; letter-spacing: 0; color: var(--ink); }
  .offer .olabel { font-size: 11.5px; font-weight: 750; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--accent); }
  .bigrow { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .btn.accept { background: var(--ok); }
  .btn.object { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
  #objectBox { display: none; margin-top: 12px; }
  .roomview .half { border-left: 4px solid var(--mark-b); background: #fdf6ee;
                    padding: 12px 16px; border-radius: 0 8px 8px 0; margin-top: 10px; }
  .roomview .half.mine { border-color: var(--mark); background: var(--accent-soft); }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in" id="shellBar"></div></div>

<div class="wrap">
  <p class="topic" id="topicLine" style="font-family:Georgia,serif;font-size:22px;margin:0 0 8px"></p>
  <div class="people" id="peopleStrip" style="display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px"></div>

  <div class="notice" id="errorBox" role="alert"></div>
  <div class="notice" id="progressBox">
    <div class="ptop"><div class="spinner"></div><span id="progressNote" aria-live="polite"></span></div>
  </div>

  <section id="stepArea"></section>
  <section id="moveArea"></section>
  <section id="outcomeArea"></section>
  <section id="roomviewArea"></section>
  <section id="roundsArea"></section>
  <section id="trajArea"></section>
  <section id="landscapeArea"></section>
</div>

<button class="btn sm" id="auditBtn" hidden onclick="openAudit()">Audit trail</button>
<aside id="auditPanel" aria-label="audit trail">
  <header><b>Audit trail — every mediator call, replayable</b>
    <button class="btn sm ghost" onclick="document.getElementById('auditPanel').classList.remove('open')">Close</button></header>
  <div class="list" id="auditList"></div>
</aside>

<script src="/static/forum.js"></script>
<script>
const DELIB_ID = location.pathname.split("/").pop();
let S = null, ME = null, structureKey = "", pollFails = 0;

async function act(path, body) {
  try { await api(path, body); await poll(true); }
  catch (e) { showError(e.message); }
}
function showError(msg) {
  $("errorBox").textContent = msg;
  $("errorBox").classList.add("on");
  setTimeout(() => $("errorBox").classList.remove("on"), 6000);
}

/* ---------- polling ---------- */

async function poll(force) {
  try {
    S = await api(`/api/d/${DELIB_ID}`);
    if (pollFails >= 2) $("errorBox").classList.remove("on");
    pollFails = 0;
  } catch (e) {
    pollFails++;
    if (pollFails >= 2 || !S) {
      $("moveArea").innerHTML = S ? $("moveArea").innerHTML : serverDownCard();
      $("errorBox").textContent = "Lost contact with the Forum server — retrying…";
      $("errorBox").classList.add("on");
    }
    return;
  }
  renderLive();
  const key = JSON.stringify([S.status, S.busy, S.error, S.speaker_count,
    S.participants.length, S.me, S.rounds.map(r => [!!r.responses, r.outcome, r.waiting_on]),
    !!S.report, S.audit_count]);
  if (force || key !== structureKey) { structureKey = key; render(); }
}
setInterval(poll, 2000);

function renderLive() {
  if (S.busy && S.progress && S.progress.note) {
    $("progressBox").classList.add("on");
    $("progressNote").textContent = S.progress.note + "…";
  } else {
    $("progressBox").classList.remove("on");
  }
  if (S.error) {
    $("errorBox").innerHTML = `${esc(S.error)} <button class="btn sm ghost" onclick="act('/api/d/${DELIB_ID}/retry', {})" style="margin-left:10px">Retry</button>`;
    $("errorBox").classList.add("on");
  }
  const chip = $("waitChip");
  const w = currentRound() && currentRound().waiting_on;
  if (chip) {
    chip.hidden = !w;
    if (w) chip.textContent = `${w.responded} of ${w.needed} responded` +
      (S.closes_at ? ` · ${closesIn(S.closes_at)}` : "");
  }
}

/* ---------- rendering ---------- */

function nameOf(id) {
  const o = (S.opinions || []).find(x => x.id === id);
  if (o) return o.name;
  return id.startsWith("u_") ? "a participant" : id;
}
function currentRound() { return S.rounds && S.rounds.length ? S.rounds[S.rounds.length - 1] : null; }

function render() {
  const drafts = saveDrafts();
  ME = S.me;
  const smap = { gathering: ["s-gathering", "gathering opinions"],
                 consensus: ["s-consensus", "consensus reached"],
                 dissensus: ["s-dissensus", "dissensus recorded"],
                 offered: ["s-live", "offer on the table"] };
  const [cls, label] = smap[S.status] || ["s-live", "in deliberation"];
  const pill = $("statusPill");
  if (pill) { pill.className = "pill " + cls; pill.textContent = label; }
  $("topicLine").textContent = S.topic;
  $("peopleStrip").innerHTML =
    S.participants.filter(p => p.spoke).map(p => `<span class="person confirmed"><i></i>${esc(p.handle)}</span>`).join("")
    + (S.include_personas ? `<span class="person confirmed" title="simulated"><i></i>8 simulated citizens</span>` : "");

  $("stepArea").innerHTML = stepperHTML();
  $("moveArea").innerHTML = moveHTML();
  $("roomviewArea").innerHTML = roomviewHTML();
  $("roundsArea").innerHTML = (S.rounds || []).slice().reverse()
    .filter(r => r.responses)
    .map(r => `<details class="pastround" ${r.outcome && ["consensus","dissensus"].includes(S.status) && r === currentRound() ? "open" : ""}>
      <summary>Round ${r.number}: “${esc(r.offer.title)}” — ${pct(r.approval)}% accepted (${esc(r.outcome || "")})</summary>
      ${roundHTML(r)}</details>`).join("");
  $("trajArea").innerHTML = trajCardHTML();
  $("landscapeArea").innerHTML = allOpinionsHTML();
  $("outcomeArea").innerHTML = outcomeHTML();
  $("auditBtn").hidden = !S.audit_count;
  $("auditBtn").textContent = `Audit trail (${S.audit_count})`;
  restoreDrafts(drafts);
  renderLive();
}

function saveDrafts() {
  const out = {};
  ["posText", "objText"].forEach(i => { const el = $(i); if (el) out[i] = el.value; });
  out._objOpen = $("objectBox") && $("objectBox").style.display === "block";
  return out;
}
function restoreDrafts(d) {
  Object.entries(d).forEach(([i, v]) => {
    if (i === "_objOpen" && v && $("objectBox")) $("objectBox").style.display = "block";
    else if ($(i) && !$(i).value) $(i).value = v;
  });
}

/* ---- stepper ---- */

function stepperHTML() {
  const stage = S.status === "gathering" ? 0
    : S.status === "landscape" ? 1
    : S.status === "offered" ? 1
    : S.status === "evaluated" ? 2
    : ["consensus", "dissensus"].includes(S.status) ? 3 : 1;
  const names = ["everyone speaks", "the offer", "accept or object",
    S.status === "dissensus" ? "disagreement mapped" : "consensus"];
  const stageForDisplay = S.status === "offered" && ME && ME.responded ? 2 : stage;
  const round = S.rounds && S.rounds.length
    ? `<span class="hint" style="margin-left:6px">round ${S.rounds.length} of up to ${S.max_rounds}</span>` : "";
  return `<div class="steps" role="list" aria-label="how Forum works">` +
    names.map((n, i) => `<span class="st ${i < stageForDisplay ? "done" : i === stageForDisplay ? "now" : ""}" role="listitem">${n}</span>`)
      .join(`<span class="arr">→</span>`) + round + `</div>`;
}

/* ---- your move ---- */

function moveHTML() {
  if (["consensus", "dissensus"].includes(S.status)) return "";

  if (S.status === "gathering") {
    if (ME && ME.has_position) {
      const begin = ME.is_creator && S.speaker_count >= 1 && S.speaker_count < S.min_participants
        ? `<button class="btn ghost" onclick="act('/api/d/${DELIB_ID}/begin', {})">Begin with ${S.speaker_count}</button>` : "";
      return `<div class="card waiting"><h2 style="font-size:16px">You've spoken</h2>
        <p class="sub" style="margin:0">“${esc(ME.opinion.slice(0, 160))}${ME.opinion.length > 160 ? "…" : ""}”</p>
        <p class="sub" style="margin:6px 0 0">The deliberation begins when ${S.min_participants} ${S.min_participants === 1 ? "person has" : "people have"} spoken — ${S.speaker_count} so far.</p>
        <div class="row"><button class="btn sm ghost" onclick="navigator.clipboard.writeText(location.href).then(() => showError('Invite link copied'))">Copy invite link</button>${begin}</div></div>`;
    }
    return `<div class="card yourmove"><h2>what do you think?</h2>
      <p class="sub">Your words, exactly as you write them, join the room. The Forum will then show you the other side, and work on a solution everyone could live with. No account needed — just speak.</p>
      <textarea id="posText" rows="4" placeholder="Your honest opinion on the topic…"></textarea>
      <div class="row"><button class="btn" onclick="act('/api/d/${DELIB_ID}/position', {text: $('posText').value})">That's what I think</button></div>
    </div>`;
  }

  if (!ME || !ME.has_position) {
    return `<div class="card waiting"><h2 style="font-size:16px">You're watching</h2>
      <p class="sub" style="margin:0">This deliberation started before you joined — results appear as rounds close. Open your own from <a href="/">the Forum floor</a>.</p></div>`;
  }

  if (S.status === "offered") {
    const r = currentRound();
    const o = r.offer;
    if (ME.responded) {
      const w = r.waiting_on || {};
      return `<div class="card waiting"><h2 style="font-size:16px">${ME.my_response.response === "accept" ? "You accepted" : "You objected"}</h2>
        <p class="sub" style="margin:0">${ME.my_response.response === "object" ? `“${esc(ME.my_response.objection)}” — your objection goes straight to the mediator. ` : ""}Waiting for the others — ${w.responded ?? "?"} of ${w.needed ?? "?"} responded. The simulated citizens respond when the round closes.</p></div>`;
    }
    const addressed = ME && r.number > 1 && (o.addresses || []).includes(ME.user_id);
    return `<div class="card yourmove"><h2>the mediator's offer${r.number > 1 ? ` — revision ${r.number}` : ""}</h2>
      <div class="offer">
        <span class="olabel">Offered to everyone in this room</span>
        <h3 class="otitle">${esc(o.title)}</h3>
        ${addressed ? `<div style="margin-bottom:8px"><span class="loopbadge">this revision answers your objection</span></div>` : ""}
        <p>${esc(o.text)}</p>
        <details><summary class="hint" style="cursor:pointer">Why this could work — and what it costs</summary>
          <p class="hint" style="margin:8px 0 6px">${esc(o.rationale || "")}</p>
          <div class="chips">${(o.tradeoffs || []).map(t => `<span class="tag">⚖ ${esc(t)}</span>`).join("")}</div>
          <p class="hint" style="margin:8px 0 0">Draws from: ${(o.draws_from || []).map(nameOf).map(esc).join(", ")}</p>
        </details>
        <div class="bigrow">
          <button class="btn accept" onclick="act('/api/d/${DELIB_ID}/respond', {response: 'accept'})">I accept this</button>
          <button class="btn object" onclick="$('objectBox').style.display = 'block'; $('objText').focus()">I object…</button>
        </div>
        <div id="objectBox">
          <label for="objText">What must change for you to accept?</label>
          <textarea id="objText" rows="2" placeholder="Your objection, in your own words — it goes straight into the next revision."></textarea>
          <div class="row"><button class="btn" onclick="act('/api/d/${DELIB_ID}/respond', {response: 'object', objection: $('objText').value})">Send my objection</button></div>
        </div>
      </div>
    </div>`;
  }
  return "";
}

/* ---- where the room stands (personal) ---- */

function roomviewHTML() {
  if (!ME || !ME.opposing) return "";
  return `<div class="card roomview">
    <h2 style="font-size:17px">Where the room stands</h2>
    <p class="sub" style="margin-bottom:0">${esc(ME.opposing.summary)}</p>
    <div class="half"><b style="color:#8a4a10">The strongest case against you</b><br>${esc(ME.opposing.counter)}</div>
  </div>`;
}

/* ---- closed rounds ---- */

function roundHTML(r) {
  const counts = { accept: 0, object: 0 };
  r.responses.forEach(x => counts[x.response]++);
  return `<div class="card">
    <p style="margin-top:0">${esc(r.offer.text)}</p>
    <div class="meter"><div class="fill" style="width:${pct(r.approval)}%"></div>
      <div class="thresh" style="left:${pct(S.threshold)}%"><span class="tlabel" style="left:50%">needs ${pct(S.threshold)}%</span></div>
      <span class="vlabel">${pct(r.approval)}%</span></div>
    <div class="dist">
      ${counts.accept ? `<div style="flex:${counts.accept};background:var(--ok)" title="accepted: ${counts.accept}"></div>` : ""}
      ${counts.object ? `<div style="flex:${counts.object};background:var(--bad)" title="objected: ${counts.object}"></div>` : ""}
    </div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>accepted — ${counts.accept}</span>
      <span><i style="background:var(--bad)"></i>objected — ${counts.object}</span></div>
    <div class="cluster-bars">${Object.entries(r.approval_by_cluster || {}).map(([label, v]) => `
      <div>${esc(label)} — ${v.accepting}/${v.total}<div class="cbar"><div style="width:${pct(v.accepting / v.total)}%"></div></div></div>`).join("")}</div>
    <details><summary class="hint" style="cursor:pointer">Every response (${r.responses.length})</summary>
      ${r.responses.map(x => `<div class="rating"><b>${esc(nameOf(x.id))}</b>
        <span class="verdict ${x.response === "accept" ? "v-accept" : "v-reject"}">${x.response}</span><br>${esc(x.objection)}</div>`).join("")}
    </details>
    ${r.outcome === "revise" ? `<div class="banner revise">↻ Below threshold — the objections above went straight into the next revision.</div>` : ""}
  </div>`;
}

/* ---- trajectory + opinions + outcome ---- */

function trajCardHTML() {
  const pts = (S.rounds || []).filter(r => r.approval !== undefined && r.approval !== null);
  if (pts.length < 2) return "";
  const W = 640, H = 190, L = 44, R = 18, T = 16, B = 34;
  const n = Math.max(S.max_rounds, pts.length);
  const x = (i) => L + (n === 1 ? 0 : (i * (W - L - R) / (n - 1)));
  const y = (v) => T + (1 - v) * (H - T - B);
  const grid = [0, .25, .5, .75, 1].map(g =>
    `<line x1="${L}" y1="${y(g)}" x2="${W - R}" y2="${y(g)}" stroke="#eceadf"/>
     <text x="${L - 8}" y="${y(g) + 4}" text-anchor="end">${pct(g)}</text>`).join("");
  const th = `<line x1="${L}" y1="${y(S.threshold)}" x2="${W - R}" y2="${y(S.threshold)}"
      stroke="#20242a" stroke-width="1.5" stroke-dasharray="5 4" opacity=".55"/>
      <text x="${W - R}" y="${y(S.threshold) - 6}" text-anchor="end">threshold ${pct(S.threshold)}%</text>`;
  const path = pts.map((r, i) => `${i ? "L" : "M"}${x(i)},${y(r.approval)}`).join(" ");
  const dots = pts.map((r, i) => `
    <circle cx="${x(i)}" cy="${y(r.approval)}" r="10" fill="transparent"><title>Round ${r.number}: ${pct(r.approval)}%</title></circle>
    <circle cx="${x(i)}" cy="${y(r.approval)}" r="4.5" fill="var(--mark)" stroke="#fff" stroke-width="2"/>
    ${i === pts.length - 1 ? `<text class="val" x="${x(i)}" y="${y(r.approval) - 12}" text-anchor="middle">${pct(r.approval)}%</text>` : ""}`).join("");
  const xl = Array.from({ length: n }, (_, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">R${i + 1}</text>`).join("");
  return `<div class="card"><h2 style="font-size:17px">Acceptance across rounds</h2>
    <svg class="traj" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="acceptance per round">${grid}${th}
    <path d="${path}" fill="none" stroke="var(--mark)" stroke-width="2.5" stroke-linecap="round"/>${dots}${xl}</svg></div>`;
}

function allOpinionsHTML() {
  const ops = S.opinions || [];
  if (!ops.length) return "";
  if (S.status === "gathering") {
    return `<div class="card"><h2>Every opinion so far <span class="hint">(${ops.length})</span></h2>
      <p class="sub">Once ${S.min_participants} ${S.min_participants === 1 ? "person has" : "people have"} spoken, the Forum reads the room, shows each person the other side, and makes its first offer.</p>
      ${ops.map(o => `<div class="rating"><b>${esc(o.name)}</b> ${esc(o.opinion)}</div>`).join("")}</div>`;
  }
  return `<details class="pastround"><summary>Every opinion in the room (${ops.length})</summary>
    <div class="card">${ops.map(o => `<div class="rating"><b>${esc(o.name)}</b> ${esc(o.opinion)}</div>`).join("")}</div>
  </details>`;
}

function outcomeHTML() {
  if (!S.report) return "";
  const R = S.report, ok = S.status === "consensus";
  return `<div class="card">
    <h2>${ok ? "Consensus" : "Dissensus"} — the closing report</h2>
    <p class="sub">${ok ? "A supermajority genuinely accepts the final offer." : "The group could not honestly converge — this map of the disagreement is the product."}</p>
    <p style="font-family:Georgia,serif;font-size:16.5px">${esc(R.summary)}</p>
    <h3>Broadly agreed</h3><ul>${(R.agreed || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    <h3>Still contested</h3><ul>${(R.contested || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    <h3>How the offer evolved</h3><p class="hint">${esc(R.evolution)}</p>
    <div class="row"><a class="btn ghost" href="/">Back to the Forum floor</a></div>
  </div>`;
}

async function openAudit() {
  $("auditPanel").classList.add("open");
  const { audit } = await api(`/api/d/${DELIB_ID}/audit`);
  $("auditList").innerHTML = audit.map(a => `<details class="call">
    <summary><b>${esc(a.task)}</b> · ${esc(a.backend)} · ${a.duration_s}s</summary>
    <pre>PROMPT\n──────\n${esc(a.prompt)}\n\nRESPONSE\n────────\n${esc(JSON.stringify(a.response, null, 2))}</pre>
  </details>`).join("");
}

/* ---------- init: never blank ---------- */
shell("room").catch(() => {}).then(() => {
  const nav = document.querySelector("#shellBar .nav");
  if (nav) nav.insertAdjacentHTML("afterend",
    `<span class="pill" id="statusPill"></span><span class="chip" id="waitChip" hidden></span>`);
  poll(true);
}).catch(() => { $("moveArea").innerHTML = serverDownCard(); });
</script>
</body>
</html>
